<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minha Jornada</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icone.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nossa Jornada">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        :root { --primary: #FF4B5C; --sky: #BAE6FD; --card: #FFFFFF; --text-main: #1E293B; --text-sub: #64748B; --money: #10B981; }
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--sky); margin: 0; padding: 0; overflow: hidden; touch-action: manipulation; color: var(--text-main); }
        .header { background: #fff; padding: 15px 16px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.03); position: relative; z-index: 100; }
        .header h3 { margin: 0; font-size: 18px; color: var(--primary) !important; font-weight: 800; }
        #info { font-size: 10px; font-weight: 800; color: #000; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; display: block; }

        .aba { display: none; width: 100%; height: calc(100vh - 110px); overflow-y: auto; padding-bottom: 70px; -webkit-overflow-scrolling: touch; }
        .ativa { display: block; }
        .card { background: var(--card); padding: 20px; margin: 16px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }

        /* MAPA */
        .mapa-card { background: var(--card); margin: 16px; border-radius: 28px; height: calc(100% - 32px); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        #svg-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #fff; }
        path { fill: #F1F5F9; stroke: #fff; stroke-width: 0.8; transition: 0.5s; cursor: pointer; }
        
        /* Cores das Regiões */
        .visitado[id^="BRAC"], .visitado[id^="BRAM"], .visitado[id^="BRRR"], .visitado[id^="BRRO"], .visitado[id^="BRPA"], .visitado[id^="BRAP"], .visitado[id^="BRTO"] { fill: #22C55E !important; }
        .visitado[id^="BRMA"], .visitado[id^="BRPI"], .visitado[id^="BRCE"], .visitado[id^="BRRN"], .visitado[id^="BRPB"], .visitado[id^="BRPE"], .visitado[id^="BRAL"], .visitado[id^="BRSE"], .visitado[id^="BRBA"] { fill: #FACC15 !important; }
        .visitado[id^="BRMT"], .visitado[id^="BRMS"], .visitado[id^="BRGO"], .visitado[id^="BRDF"] { fill: #FB923C !important; }
        .visitado[id^="BRMG"], .visitado[id^="BRSP"], .visitado[id^="BRRJ"], .visitado[id^="BRES"] { fill: #EC4899 !important; }
        .visitado[id^="BRPR"], .visitado[id^="BRSC"], .visitado[id^="BRRS"] { fill: #A855F7 !important; }

        /* TIMELINE */
        .timeline-container { padding: 10px 5px; position: relative; }
        .timeline-line { position: absolute; left: 33px; top: 60px; bottom: 20px; width: 3px; background: rgba(255,255,255,0.8); z-index: 0; border-radius: 10px; }
        .timeline-item { display: flex; gap: 15px; margin-bottom: 25px; position: relative; z-index: 2; margin-left: 20px; margin-right: 16px; }
        .t-dot { min-width: 14px; height: 14px; background: var(--primary); border: 3px solid #fff; border-radius: 50%; margin-top: 6px; z-index: 3; }
        .t-card { background: #fff; padding: 18px; border-radius: 24px; flex: 1; box-shadow: 0 8px 25px rgba(0,0,0,0.04); }

        /* GASTOS */
        .resumo-uf-card { background: #fff; border-radius: 24px; padding: 20px; margin-bottom: 16px; border: 1.5px solid #F1F5F9; }
        .uf-header { display: flex; justify-content: space-between; align-items: center; font-weight: 800; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 8px;}
        .pill { background: #F8FAFC; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; color: var(--text-sub); display: flex; align-items: center; gap: 4px; border: 1px solid #eee; }

        /* CONQUISTAS */
        .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; justify-items: center; }
        .badge { display: flex; flex-direction: column; align-items: center; width: 80px; opacity: 0.15; filter: grayscale(1); transition: 0.4s; }
        .badge.active { opacity: 1; filter: grayscale(0); transform: scale(1.05); }
        .b-icon { width: 50px; height: 50px; background: #F1F5F9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 4px; }
        .badge-name { font-size: 9px; font-weight: 800; color: var(--text-sub); text-align: center; text-transform: uppercase; }

        /* CARROSSEL FOTOS */
        .carousel-fotos { position: relative; width: 100%; overflow: hidden; border-radius: 20px; height: 180px; background: #f1f5f9; margin: 10px 0; }
        .track-fotos { display: flex; height: 100%; transition: transform 0.4s ease; }
        .img-slide { min-width: 100%; height: 100%; object-fit: cover; }

        /* FORMULÁRIO */
        input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid #F1F5F9; font-family: inherit; background: #F8FAFC; box-sizing: border-box; margin-bottom: 8px; }
        label { font-size: 10px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin: 4px; display: block; }
        .btn-acao { background: var(--money); color: #fff; border: none; padding: 16px; border-radius: 18px; width: 100%; font-weight: 800; cursor: pointer; margin-top: 10px; }

        /* NAV */
        .menu-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; height: 60px; border-top-left-radius: 28px; border-top-right-radius: 28px; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); }
        .btn-aba { flex: 1; border: none; background: none; font-size: 20px; color: #CBD5E1; cursor: pointer; }
        .btn-aba.active { color: var(--primary); transform: translateY(-5px); }

        #photo-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 24px; border-radius: 32px; z-index: 2100; width: 90%; max-width: 340px; display: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: none; backdrop-filter: blur(4px); }
    </style>
</head>
<body>

    <div class="header">
        <h3>📸 Minha Jornada 🧳</h3>
        <span id="info">ESTADOS CONQUISTADOS: 0</span>
    </div>

    <div id="overlay" onclick="fecharPopup()"></div>
    <div id="photo-popup"><div id="popup-content"></div></div>

    <!-- MAPA -->
    <div id="aba-mapa" class="aba ativa">
        <div class="mapa-card">
            <button onclick="resetarMapa()" style="position: absolute; top: 15px; right: 15px; z-index: 1000; background: white; border: none; padding: 10px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">🔄</button>
            <div id="svg-container"></div>
        </div>
    </div>

    <!-- TIMELINE -->
    <div id="aba-timeline" class="aba">
        <div class="timeline-container">
            <div class="timeline-line"></div>
            <div id="timeline-list"></div>
        </div>
    </div>

    <!-- CONQUISTAS -->
    <div id="aba-conquistas" class="aba">
        <div class="card">
            <h3>🏆 Conquistas</h3>
            <div class="badge-grid" id="grid-conquistas"></div>
        </div>
    </div>

    <!-- REGISTRO -->
    <div id="aba-registro" class="aba">
        <div class="card">
            <h3>📍 Nova Viagem</h3>
            <label>Estado</label>
            <select id="sel-uf">
                <option value="BRSP" selected>São Paulo</option><option value="BRRJ">Rio de Janeiro</option><option value="BRMG">Minas Gerais</option><option value="BRBA">Bahia</option><option value="BRSC">Santa Catarina</option><option value="BRPR">Paraná</option><option value="BRRS">Rio Grande do Sul</option><option value="BRGO">Goiás</option><option value="BRDF">Distrito Federal</option><option value="BRES">Espírito Santo</option><option value="BRCE">Ceará</option><option value="BRPE">Pernambuco</option><option value="BRRN">Rio Grande do Norte</option><option value="BRPB">Paraíba</option><option value="BRAL">Alagoas</option><option value="BRSE">Sergipe</option><option value="BRMA">Maranhão</option><option value="BRPI">Piauí</option><option value="BRMT">Mato Grosso</option><option value="BRMS">Mato Grosso do Sul</option><option value="BRTO">Tocantins</option><option value="BRPA">Pará</option><option value="BRAM">Amazonas</option><option value="BRRO">Rondônia</option><option value="BRAC">Acre</option><option value="BRRR">Roraima</option><option value="BRAP">Amapá</option>
            </select>
            <label>Cidade</label><input type="text" id="txt-cidade" placeholder="Ex: Santana de Parnaíba">
            <label>Data</label><input type="date" id="txt-data">
            
            <label>Gastos (R$)</label>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                <input type="number" id="v-hosp" placeholder="Hotel">
                <input type="number" id="v-trans" placeholder="Transporte">
                <input type="number" id="v-alime" placeholder="Comida">
                <input type="number" id="v-atrac" placeholder="Atrações">
            </div>

            <label>Fotos</label><input type="file" id="inp-foto" accept="image/*" multiple>
            <button class="btn-acao" onclick="salvarViagem()">Salvar na Jornada 🚩</button>
        </div>
    </div>

    <!-- GASTOS -->
    <div id="aba-gastos" class="aba">
        <div class="card">
            <h3>💰 Relatório de Gastos</h3>
            <div id="lista-gastos"></div>
            <div style="background:var(--money); color:#fff; padding:15px; border-radius:20px; text-align:center; font-weight:800; margin-top:20px;" id="total-geral">Total: R$ 0,00</div>
        </div>
    </div>

    <nav class="menu-nav">
        <button class="btn-aba active" onclick="trocarAba('mapa', this)">🗺️</button>
        <button class="btn-aba" onclick="trocarAba('timeline', this)">🕒</button>
        <button class="btn-aba" onclick="trocarAba('conquistas', this)">🏆</button>
        <button class="btn-aba" onclick="trocarAba('registro', this)">➕</button>
        <button class="btn-aba" onclick="trocarAba('gastos', this)">💰</button>
    </nav>

    <script>
        const DB_NAME = "JornadaCasalProDB";
        const STORE_NAME = "viagens";
        let dbGlobal = [];

        function initDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => { e.target.result.createObjectStore(STORE_NAME, { keyPath: "id" }); };
                request.onsuccess = (e) => resolve(e.target.result);
            });
        }

        async function dbSalvar(dados) {
            const db = await initDB();
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(dados);
            return new Promise(r => tx.oncomplete = r);
        }

        async function dbListar() {
            const db = await initDB();
            const tx = db.transaction(STORE_NAME, "readonly");
            const request = tx.objectStore(STORE_NAME).getAll();
            return new Promise(r => request.onsuccess = () => r(request.result));
        }

        async function salvarViagem() {
            const cidade = document.getElementById('txt-cidade').value;
            const data = document.getElementById('txt-data').value;
            if(!cidade || !data) return alert("Cidade e Data são obrigatórios!");

            const h = parseFloat(document.getElementById('v-hosp').value) || 0;
            const t = parseFloat(document.getElementById('v-trans').value) || 0;
            const al = parseFloat(document.getElementById('v-alime').value) || 0;
            const at = parseFloat(document.getElementById('v-atrac').value) || 0;

            const novaViagem = {
                id: Date.now().toString(),
                uf: document.getElementById('sel-uf').value,
                cidade, data,
                h, t, al, at, total: h + t + al + at,
                fotos: Array.from(document.getElementById('inp-foto').files)
            };

            await dbSalvar(novaViagem);
            alert("Memória registrada!");
            limparForm();
            carregarDados();
            trocarAba('mapa', document.querySelectorAll('.btn-aba')[0]);
        }

        function limparForm() {
            ['txt-cidade','txt-data','v-hosp','v-trans','v-alime','v-atrac','inp-foto'].forEach(id => document.getElementById(id).value = "");
        }

        async function carregarDados() {
            dbGlobal = await dbListar();
            atualizarMapa();
            renderTimeline();
            renderGastos();
            renderConquistas();
        }

        function atualizarMapa() {
            const visitados = [...new Set(dbGlobal.map(v => v.uf))];
            document.querySelectorAll('path').forEach(p => p.classList.remove('visitado'));
            visitados.forEach(uf => { if(document.getElementById(uf)) document.getElementById(uf).classList.add('visitado'); });
            document.getElementById('info').innerText = `ESTADOS CONQUISTADOS: ${visitados.length}`;
        }

        function renderTimeline() {
            const lista = document.getElementById('timeline-list');
            lista.innerHTML = '';
            const ordenadas = [...dbGlobal].sort((a,b) => new Date(b.data) - new Date(a.data));

            ordenadas.forEach(v => {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                let fotos = v.fotos.map(f => `<img src="${URL.createObjectURL(f)}" class="img-slide">`).join('');
                
                item.innerHTML = `
                    <div class="t-dot"></div>
                    <div class="t-card">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <b style="color:var(--primary)">${v.uf.replace('BR','')}</b>
                            <small>${v.data.split('-').reverse().join('/')}</small>
                        </div>
                        <h4 style="margin:5px 0">${v.cidade}</h4>
                        <div class="carousel-fotos"><div class="track-fotos">${fotos || '<div style="padding:80px;text-align:center;color:#ccc">📍 Sem fotos</div>'}</div></div>
                        <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:800; color:var(--money)">
                            <span>R$ ${v.total.toLocaleString('pt-BR')}</span>
                        </div>
                    </div>
                `;
                lista.appendChild(item);
            });
        }

        function renderConquistas() {
            const grid = document.getElementById('grid-conquistas');
            const n = [...new Set(dbGlobal.map(v => v.uf))].length;
            const metas = [
                {id:1, n:1, l:'Primeiro Passo', i:'🌱'}, {id:2, n:5, l:'Viajantes', i:'🚗'},
                {id:3, n:10, l:'Exploradores', i:'✈️'}, {id:4, n:15, l:'Aventureiros', i:'⛰️'},
                {id:5, n:20, l:'Nômades', i:'🌍'}, {id:6, n:26, l:'Donos do Brasil', i:'👑'}
            ];
            grid.innerHTML = metas.map(m => `
                <div class="badge ${n >= m.n ? 'active' : ''}">
                    <div class="b-icon">${m.i}</div>
                    <div class="badge-name">${m.l}</div>
                </div>
            `).join('');
        }

        function renderGastos() {
            const container = document.getElementById('lista-gastos');
            container.innerHTML = '';
            let totalGeral = 0;
            const ufs = [...new Set(dbGlobal.map(v => v.uf))];

            ufs.forEach(uf => {
                const viagens = dbGlobal.filter(v => v.uf === uf);
                const subTotal = viagens.reduce((acc, v) => acc + v.total, 0);
                totalGeral += subTotal;

                const card = document.createElement('div');
                card.className = 'resumo-uf-card';
                card.innerHTML = `
                    <div class="uf-header"><span>🚩 ${uf.replace('BR','')}</span><span>R$ ${subTotal.toLocaleString('pt-BR')}</span></div>
                    ${viagens.map(v => `
                        <div class="gasto-entry" style="font-size:11px; opacity:0.8">
                            <span>${v.cidade}</span>
                            <div style="display:flex; gap:5px;">
                                <div class="pill">🏨 ${v.h}</div><div class="pill">🚗 ${v.t}</div>
                            </div>
                        </div>
                    `).join('')}
                `;
                container.appendChild(card);
            });
            document.getElementById('total-geral').innerText = `Total: R$ ${totalGeral.toLocaleString('pt-BR')}`;
        }

        function trocarAba(id, btn) {
            document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
            document.querySelectorAll('.btn-aba').forEach(b => b.classList.remove('active'));
            document.getElementById('aba-' + id).classList.add('ativa');
            btn.classList.add('active');
        }

        function fecharPopup() { document.getElementById('overlay').style.display = 'none'; document.getElementById('photo-popup').style.display = 'none'; }
        function resetarMapa() { if(controleMapa) { controleMapa.resetZoom(); controleMapa.center(); } }

        async function init() {
            const res = await fetch('br.svg');
            const svg = await res.text();
            document.getElementById('svg-container').innerHTML = svg;
            controleMapa = svgPanZoom(document.querySelector('#svg-container svg'), { zoomEnabled: true, controlIconsEnabled: false, fit: true, center: true });
            carregarDados();
        }

        init();
    </script>
</body>
</html>
</html>
